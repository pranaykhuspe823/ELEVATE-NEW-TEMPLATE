<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify a certificate — Core5 Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/styles.css">
</head>
<body>
<div class="wrap" style="max-width:640px">
  <header class="top">
    <div class="brand"><div class="mark">C5</div><div>Core5 Academy<small>Certificate verification</small></div></div>
  </header>
  <main id="stage">
    <article class="lesson">
      <h2>Verify a Core5 certificate</h2>
      <div class="meta">Enter the certificate ID printed on the document (e.g. C5-FPC-2026-AB12CD).</div>
      <div class="cert-form" style="grid-template-columns:1fr">
        <label>Certificate ID<input id="certId" placeholder="C5-FPC-2026-AB12CD" autocapitalize="characters"></label>
      </div>
      <div class="actions"><button class="btn" id="go">Verify</button></div>
      <div id="result"></div>
    </article>
  </main>
</div>
<script type="module" src="/src/js/verify.js"></script>
</body>
</html>
